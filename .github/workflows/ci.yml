name: Test editor and publisher

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:visual
      - name: Upload visual Playwright proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-proofs
          path: output/playwright
          if-no-files-found: error
          retention-days: 14
      - run: npm run build

  publisher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: publisher/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit
      - run: npm run deploy -- --dry-run --outdir .wrangler-dry-run
